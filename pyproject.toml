[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mx-payments-ops-lab"
version = "0.1.0"
description = "Demo lab for SPEI bill-pay reliability and B2B collections in Mexico. Synthetic data only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.39",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "plotly>=5.24",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]

[tool.setuptools]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
